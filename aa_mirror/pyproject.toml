[project]
name = "aa-mirror"
version = "0.1.0"
description = "AA Study Mirror (private): internal study copy of Artificial Analysis free-tier API data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
aa-mirror = "aa_mirror.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aa_mirror"]

[tool.pytest.ini_options]
testpaths = ["tests"]
